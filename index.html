<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Killi Maps</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --vert: #86bdbb;
    --vert-fonce: #3f7f7c;
    --vert-clair: #e8f3f2;
    --orange: #ed952b;
    --texte: #2b3537;
    --secondaire: #66757a;
    --bordure: #d9e3e3;
    --fond: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 15px;
    color: var(--texte);
    background: var(--fond);
  }
  .appli { display: flex; height: 100%; min-height: 560px; }
  .panneau {
    width: 340px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--bordure);
    min-height: 0;
  }
  .entete { padding: 14px 16px 10px; }
  .entete-ligne { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .logo { margin: 0; line-height: 0; }
  .logo svg { width: 180px; height: auto; }
  .resume { color: var(--secondaire); font-size: 13px; margin-top: 8px; }
  select {
    font: inherit;
    font-size: 13px;
    color: var(--texte);
    background: var(--fond);
    border: 1px solid var(--bordure);
    border-radius: 4px;
    padding: 4px;
  }
  .onglets { display: flex; border-bottom: 1px solid var(--bordure); padding: 0 8px; }
  .onglets button {
    flex: 1;
    font: inherit;
    font-size: 14px;
    color: var(--secondaire);
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    padding: 10px 4px;
    cursor: pointer;
  }
  .onglets button[aria-selected="true"] {
    color: var(--texte);
    font-weight: 500;
    border-bottom-color: var(--orange);
  }
  .outils { padding: 10px 16px 6px; }
  .outils input[type="search"] {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--bordure);
    border-radius: 4px;
  }
  .outils input[type="search"]:focus { outline: 2px solid var(--vert); outline-offset: -1px; }
  .fil { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .liens { display: flex; gap: 12px; margin-top: 6px; }
  .lien {
    font: inherit;
    font-size: 13px;
    color: var(--vert-fonce);
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .liste { flex: 1; overflow-y: auto; padding: 4px 8px 12px; min-height: 0; }
  .ligne {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    border-radius: 4px;
    padding: 7px 8px;
    cursor: pointer;
  }
  .ligne:hover { background: var(--vert-clair); }
  .ligne input { flex: none; margin: 0; width: 16px; height: 16px; accent-color: var(--vert-fonce); }
  .ligne .texte { flex: 1; min-width: 0; }
  .ligne .sous { display: block; color: var(--secondaire); font-size: 13px; }
  .ligne .nom-espece { font-style: italic; }
  .ligne .fleche { color: var(--orange); font-weight: 700; }
  .point-legende { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .35); }
  .vide { color: var(--secondaire); padding: 8px; }
  .carte-zone { position: relative; flex: 1; min-width: 0; }
  #carte { position: absolute; inset: 0; background: var(--vert-clair); }
  .fonds {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 500;
    display: flex;
    background: var(--fond);
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
    overflow: hidden;
  }
  .fonds button { font: inherit; font-size: 13px; color: var(--texte); background: none; border: 0; padding: 7px 10px; cursor: pointer; }
  .fonds button[aria-pressed="true"] { background: var(--vert); color: #10302f; font-weight: 500; }
  .message-carte {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: rgba(255, 255, 255, .95);
    color: var(--texte);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
    max-width: 90%;
  }
  .pastille {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid #fff;
    box-shadow: 0 0 2px rgba(0, 0, 0, .7);
  }
  .fiche { font-family: 'Roboto', Arial, sans-serif; font-size: 13px; line-height: 1.45; max-height: 280px; overflow-y: auto; }
  .fiche h2 { font-size: 15px; margin: 0 0 2px; font-weight: 700; }
  .fiche .exp { color: var(--secondaire); margin-bottom: 6px; }
  .fiche p { margin: 0 0 3px; }
  .especes { background: var(--vert-clair); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .especes-titre { color: var(--vert-fonce); font-size: 12px; font-weight: 500; margin-bottom: 3px; }
  .especes ul { list-style: none; margin: 0; padding: 0; }
  .especes li { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; font-style: italic; line-height: 1.35; }
  .especes .point-legende { width: 10px; height: 10px; }
  .especes .autres { font-size: 13px; color: var(--secondaire); margin: 4px 0 0; }
  .fiche .sans-killi { color: var(--secondaire); font-size: 13px; font-style: normal; font-weight: 400; }
  .pied { padding: 6px 16px; border-top: 1px solid var(--bordure); color: var(--secondaire); font-size: 12px; }
  @media (max-width: 760px) {
    .appli { flex-direction: column-reverse; height: auto; }
    .panneau { width: 100%; border-right: 0; max-height: none; }
    .liste { max-height: 46vh; }
    .carte-zone { flex: none; height: 52vh; min-height: 300px; }
  }
</style>
</head>

</div>

const LANGUES = {fr: "Français", en: "English", es: "Español", pt: "Português", de: "Deutsch", nl: "Nederlands", cs: "Čeština"};

const COULEURS = ["#E53935", "#1E88E5", "#FDD835", "#43A047", "#8E24AA", "#FB8C00", "#00ACC1", "#D81B60", "#6D4C41", "#7CB342", "#3949AB", "#00897B"];

const VALEURS = {
  courant: {"Nul": "courant_nul", "Très faible": "courant_tres_faible", "Faible": "courant_faible", "Moyen": "courant_moyen", "Fort": "courant_fort", "Très fort": "courant_tres_fort"},
  turbidite: {"Nulle": "turbidite_nulle", "Très faible": "turbidite_tres_faible", "Faible": "turbidite_faible", "Moyenne": "turbidite_moyenne", "Forte": "turbidite_forte", "Très forte": "turbidite_tres_forte"},
  fond: {"Sable": "fond_sable", "Vase": "fond_vase", "Limon": "fond_limon", "Argile": "fond_argile", "Gravier": "fond_gravier", "Cailloux": "fond_cailloux", "Roche": "fond_roche", "Feuilles mortes": "fond_feuilles_mortes", "Racines et branches": "fond_racines_branches", "Mixte": "fond_mixte"}
};

function lireLangue() {
  const demandee = new URLSearchParams(location.search).get("lang");
  if (demandee in LANGUES) return demandee;
  try {
    const gardee = localStorage.getItem("killi_langue");
    if (gardee in LANGUES) return gardee;
  } catch (e) { /* stockage indisponible, par exemple dans une iframe */ }
  const navigateur = (navigator.language || "en").slice(0, 2);
  return navigateur in LANGUES ? navigateur : "en";
}

const etat = {
  langue: lireLangue(),
  vue: "especes",        // especes | pays | expeditions
  pays: null,            // pays choisi (nom français de la base)
  selection: [],         // espèces ou codes d'expédition cochés, dans l'ordre (l'ordre donne la couleur)
  recherche: "",
  fond: "osm"
};

let base = {version: 0, expeditions: []};
let points = [];
let carte, calquePoints, fondPlan, fondSatellite;
let dernierCadrage = "";

function t(cle, ...valeurs) {
  const modele = (TEXTES[etat.langue] || TEXTES.en)[cle] ?? cle;
  return modele.replace(/%(\d)\$[sd]/g, (_, n) => valeurs[n - 1]);
}

// Les données viennent de saisies d'utilisateurs : tout est échappé avant d'entrer dans le HTML
function esc(texte) {
  return String(texte ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function nomPays(francais) {
  const code = CODES_PAYS[francais.trim()];
  if (!code) return francais;
  try {
    return new Intl.DisplayNames([etat.langue], {type: "region"}).of(code) || francais;
  } catch (e) {
    return francais;
  }
}

const trier = (a, b) => a.localeCompare(b, etat.langue);
const paysDe = e => String(e.pays || "").split(",").map(s => s.trim()).filter(Boolean);
const nomKilli = k => `${k.genre} ${k.espece}`;
// Les données publiques ne sont pas une expédition : elles restent sur la carte par espèce et par pays,
// mais n'apparaissent ni dans « Par expédition » ni dans le nombre d'expéditions
const estDonneesPubliques = e => e.type === "donnees_publiques";
const vraiesExpeditions = () => base.expeditions.filter(e => !estDonneesPubliques(e));

function preparer() {
  points = [];
  base.expeditions.forEach(e => {
    (e.points || []).forEach(p => {
      if (typeof p.latitude === "number" && typeof p.longitude === "number") {
        points.push({e, p, noms: (p.killies || []).map(nomKilli)});
      }
    });
  });
}

// Nom affiché d'une expédition : le code toujours suivi de l'année sur deux chiffres
// (« CCMB 89 », « COCCA 19 »). Même règle que l'application (codeAvecAnnee) :
// « BCP 2018 » → « BCP 18 », « ABDK 2010-1 » → « ABDK 10-1 », « ABC 05 » reste tel quel.
function libelleExpedition(e) {
  const code = String(e.code || "").trim();
  const annee = Number(e.annee);
  if (!(annee >= 1000 && annee <= 9999)) return code;
  const aa = String(annee % 100).padStart(2, "0");
  const complete = new RegExp(`(?<!\\d)${annee}(?!\\d)`, "g");
  if (complete.test(code)) return code.replace(complete, aa);
  if (new RegExp(`(?<!\\d)${aa}(?!\\d)`).test(code)) return code;
  return `${code} ${aa}`;
}

// Numéro seul : les anciens points écrivaient « GACOCC 19-60 » ou « GFC-03 », on garde « 60 », « 03 »
function numeroCourt(numero) {
  const n = String(numero || "").trim();
  const m = /^[A-Za-z][A-Za-z ]*\s\d{2,4}-(.+)$/.exec(n) || /^[A-Za-z]+-(.+)$/.exec(n);
  return m ? m[1] : n;
}

function pointsDuPays(pays) {
  return pays ? points.filter(x => paysDe(x.e).includes(pays)) : points;
}

function especesDe(pays) {
  const compte = new Map();
  pointsDuPays(pays).forEach(x => new Set(x.noms).forEach(n => compte.set(n, (compte.get(n) || 0) + 1)));
  return [...compte.entries()].sort((a, b) => trier(a[0], b[0]));
}

function listePays(sources) {
  const tous = new Map();
  sources.forEach(e => paysDe(e).forEach(p => {
    if (!tous.has(p)) tous.set(p, []);
    tous.get(p).push(e);
  }));
  return [...tous.entries()].sort((a, b) => trier(nomPays(a[0]), nomPays(b[0])));
}

function couleurDe(cle) {
  const i = etat.selection.indexOf(cle);
  return i < 0 ? null : COULEURS[i % COULEURS.length];
}

function changerVue(vue) {
  Object.assign(etat, {vue, pays: null, selection: [], recherche: ""});
  afficher();
}

function choisirPays(pays) {
  Object.assign(etat, {pays, selection: [], recherche: ""});
  afficher();
}

function basculer(cle) {
  const i = etat.selection.indexOf(cle);
  if (i < 0) etat.selection.push(cle); else etat.selection.splice(i, 1);
  // La liste est redessinée : on reste au même endroit
  const liste = document.getElementById("liste");
  const position = liste.scrollTop;
  afficher();
  liste.scrollTop = position;
}

function ligneCoche(cle, titre, sous, italique) {
  const couleur = couleurDe(cle);
  const label = document.createElement("label");
  label.className = "ligne";
  const coche = document.createElement("input");
  coche.type = "checkbox";
  coche.checked = couleur !== null;
  coche.addEventListener("change", () => basculer(cle));
  label.append(coche);
  const texte = document.createElement("span");
  texte.className = "texte";
  texte.innerHTML = `<span class="${italique ? "nom-espece" : ""}">${esc(titre)}</span><span class="sous">${esc(sous).replace(/\n/g, "<br>")}</span>`;
  label.append(texte);
  if (couleur) {
    const pastille = document.createElement("span");
    pastille.className = "point-legende";
    pastille.style.background = couleur;
    label.append(pastille);
  }
  return label;
}

function ligneChoix(titre, sous, action) {
  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.className = "ligne";
  bouton.innerHTML = `<span class="texte">${esc(titre)}<span class="sous">${esc(sous)}</span></span><span class="fleche" aria-hidden="true">›</span>`;
  bouton.addEventListener("click", action);
  return bouton;
}

function lienOutil(texte, action) {
  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.className = "lien";
  bouton.textContent = texte;
  bouton.addEventListener("click", action);
  return bouton;
}

// Barre au-dessus de la liste : pays choisi, recherche, tout cocher / décocher
function afficherOutils(cles, recherchable) {
  const outils = document.getElementById("outils");
  const champActif = document.activeElement && document.activeElement.id === "recherche";
  outils.replaceChildren();
  if (etat.pays) {
    const fil = document.createElement("div");
    fil.className = "fil";
    fil.textContent = nomPays(etat.pays);
    outils.append(fil, lienOutil(t("retour"), () => choisirPays(null)));
  }
  if (recherchable) {
    const champ = document.createElement("input");
    champ.type = "search";
    champ.id = "recherche";
    champ.placeholder = t("rechercher_espece");
    champ.setAttribute("aria-label", t("rechercher_espece"));
    champ.value = etat.recherche;
    champ.addEventListener("input", () => {
      etat.recherche = champ.value;
      afficherListe();
      document.getElementById("recherche").focus();
    });
    outils.append(champ);
    if (champActif) requestAnimationFrame(() => champ.focus());
  }
  if (cles) {
    const liens = document.createElement("div");
    liens.className = "liens";
    liens.append(
      lienOutil(t("tout_selectionner"), () => { etat.selection = cles.slice(); afficher(); }),
      lienOutil(t("tout_deselectionner"), () => { etat.selection = []; afficher(); })
    );
    outils.append(liens);
  }
}

function afficherListe() {
  const liste = document.getElementById("liste");
  liste.replaceChildren();
  const especesVisibles = etat.vue === "especes" || (etat.vue === "pays" && etat.pays);

  if (especesVisibles) {
    const especes = especesDe(etat.pays);
    const recherche = etat.recherche.trim().toLowerCase();
    const filtrees = especes.filter(([n]) => n.toLowerCase().includes(recherche));
    afficherOutils(filtrees.map(([n]) => n), true);
    filtrees.forEach(([nom, nb]) => liste.append(ligneCoche(nom, nom, t("nb_points_court", nb), true)));
    if (!filtrees.length) liste.innerHTML = `<div class="vide">${esc(t("web_aucun_resultat"))}</div>`;
  } else if (!etat.pays) {
    afficherOutils(null, false);
    listePays(etat.vue === "expeditions" ? vraiesExpeditions() : base.expeditions).forEach(([pays, exps]) => {
      const nb = exps.reduce((s, e) => s + (e.points || []).length, 0);
      const sous = etat.vue === "expeditions" ? t("resume_pays_expeditions", exps.length, nb) : t("nb_points_court", nb);
      liste.append(ligneChoix(nomPays(pays), sous, () => choisirPays(pays)));
    });
  } else {
    const exps = vraiesExpeditions().filter(e => paysDe(e).includes(etat.pays));
    afficherOutils(exps.map(libelleExpedition), false);
    exps.forEach(e => {
      const resume = t("resume_expedition_publiee", e.annee || "", (e.points || []).length).replace(/^\s*·\s*/, "");
      const sous = resume + (e.collecteurs ? `\n${e.collecteurs}` : "");
      liste.append(ligneCoche(libelleExpedition(e), libelleExpedition(e), sous, false));
    });
  }
}

function coordonnee(valeur) {
  return DECIMALES_GPS === null ? valeur : Number(valeur.toFixed(DECIMALES_GPS));
}

function champ(libelle, valeur) {
  if (valeur === undefined || valeur === null || valeur === "") return "";
  return `<p>${esc(t("pdf_champ", libelle, valeur))}</p>`;
}

// Même format que l'application : 2018-01-23 devient 23/01/2018 (autre format : affiché tel quel)
function dateAffichee(date) {
  const parties = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || "");
  return parties ? `${parties[3]}/${parties[2]}/${parties[1]}` : (date || "");
}

function traduire(categorie, valeur) {
  const cle = VALEURS[categorie][valeur];
  return cle ? t(cle) : valeur;
}

function fiche(x) {
  const {e, p} = x;
  const publiques = estDonneesPubliques(e);
  // La base écrit l'heure avec les secondes (10:03:00) : on garde les heures et les minutes
  const heure = (p.heure || "").slice(0, 5);
  const jour = dateAffichee(p.date);
  const quand = jour && heure ? t("date_heure", jour, heure) : (jour || heure);
  // Titre : « GACOCC 19-60 · Iroungou » (code, année sur deux chiffres, numéro, localité) ; en gris : le pays
  const numero = numeroCourt(p.numero);
  const debut = publiques ? t("donnees_publiques") : (numero ? `${libelleExpedition(e)}-${numero}` : libelleExpedition(e));
  const titre = [debut, p.localite].filter(Boolean).join(" · ");
  const env = [
    p.tEau !== undefined ? t("env_eau", `${p.tEau} °C`) : "",
    p.conductivite !== undefined ? `${p.conductivite} µS/cm` : "",
    p.ph !== undefined ? `pH ${p.ph}` : "",
    p.courant ? t("env_courant", traduire("courant", p.courant)) : "",
    p.fond ? t("env_fond", traduire("fond", p.fond)) : "",
    p.turbidite ? t("env_turbidite", traduire("turbidite", p.turbidite)) : ""
  ].filter(Boolean).join(" · ");
  // Les espèces passent en premier ; celles cochées dans la liste gardent leur couleur
  const noms = [...new Set(x.noms)];
  const ligneKilli = n => {
    const couleur = couleurDe(n);
    const point = couleur ? `<span class="point-legende" style="background:${couleur}"></span>` : "";
    return `<li>${point}${esc(n)}</li>`;
  };
  const autres = p.autresEspeces
    ? `<p class="autres">${esc(t("pdf_champ", t("champ_autres_especes"), p.autresEspeces))}</p>`
    : "";
  const especes = `<div class="especes"><div class="especes-titre">${esc(t("killies_observes"))}</div>` +
    (noms.length ? `<ul>${noms.map(ligneKilli).join("")}</ul>` : `<div class="sans-killi">${esc(t("pas_de_killies"))}</div>`) +
    autres + `</div>`;
  return `<div class="fiche"><h2>${esc(titre)}</h2>` +
    `<div class="exp">${esc(paysDe(e).map(nomPays).join(", "))}</div>` +
    especes +
    champ(t("champ_date"), quand) +
    champ(t("champ_gps"), `${coordonnee(p.latitude)}, ${coordonnee(p.longitude)}`) +
    champ(t("champ_altitude"), p.altitude !== undefined ? `${p.altitude} m` : "") +
    champ(t("champ_biotope"), p.biotope) +
    champ(t("champ_notes"), p.remarques) +
    champ(t("champ_environnement"), env) +
    `</div>`;
}

function pastille(couleurs) {
  const part = 100 / couleurs.length;
  const fond = couleurs.length === 1
    ? couleurs[0]
    : `conic-gradient(${couleurs.map((c, i) => `${c} ${i * part}% ${(i + 1) * part}%`).join(",")})`;
  return L.divIcon({
    className: "",
    html: `<span class="pastille" style="background:${fond}"></span>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -8]
  });
}

function pointsAffiches() {
  const parExpedition = etat.vue === "expeditions";
  // Rien de coché : la carte reste vide
  if (!etat.selection.length) return [];
  return pointsDuPays(etat.pays).map(x => {
    const cles = parExpedition ? [libelleExpedition(x.e)] : [...new Set(x.noms)];
    const couleurs = cles.map(couleurDe).filter(Boolean);
    return {x, couleurs};
  }).filter(a => a.couleurs.length);
}

function afficherCarte() {
  const affiches = pointsAffiches();
  calquePoints.clearLayers();
  const coords = [];
  affiches.forEach(({x, couleurs}) => {
    const position = [x.p.latitude, x.p.longitude];
    coords.push(position);
    L.marker(position, {icon: pastille(couleurs)}).bindPopup(() => fiche(x), {maxWidth: 300}).addTo(calquePoints);
  });

  const message = document.getElementById("message");
  message.hidden = coords.length > 0;
  message.textContent = etat.selection.length ? t("aucun_point_selection") : t("web_choisir");

  // Recadre seulement quand l'ensemble des points affichés change
  const empreinte = coords.map(c => c.join(",")).join(";");
  if (empreinte !== dernierCadrage) {
    dernierCadrage = empreinte;
    if (coords.length) carte.fitBounds(coords, {padding: [40, 40], maxZoom: 12});
  }
}

function afficherFonds() {
  const zone = document.getElementById("fonds");
  zone.replaceChildren();
  [["osm", t("fond_classique")], ["satellite", t("fond_satellite")]].forEach(([cle, texte]) => {
    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.textContent = texte;
    bouton.setAttribute("aria-pressed", String(etat.fond === cle));
    bouton.addEventListener("click", () => {
      etat.fond = cle;
      carte.removeLayer(cle === "osm" ? fondSatellite : fondPlan);
      carte.addLayer(cle === "osm" ? fondPlan : fondSatellite);
      afficherFonds();
    });
    zone.append(bouton);
  });
}

function afficher() {
  document.documentElement.lang = etat.langue;
  document.title = `Killi Maps · ${t("accueil_killies")}`;
  document.getElementById("resume").textContent =
    t("resume_expeditions_publiees", vraiesExpeditions().length, base.expeditions.reduce((s, e) => s + (e.points || []).length, 0));
  document.getElementById("pied").textContent = base.version ? t("web_version_base", base.version) : "";

  const onglets = document.getElementById("onglets");
  onglets.replaceChildren();
  [["especes", "par_espece"], ["pays", "par_pays"], ["expeditions", "par_expedition"]].forEach(([vue, cle]) => {
    const bouton = document.createElement("button");
    bouton.type = "button";
    bouton.role = "tab";
    bouton.textContent = t(cle);
    bouton.setAttribute("aria-selected", String(etat.vue === vue));
    bouton.addEventListener("click", () => changerVue(vue));
    onglets.append(bouton);
  });

  afficherListe();
  afficherFonds();
  afficherCarte();
}

function preparerLangues() {
  const choix = document.getElementById("langue");
  choix.setAttribute("aria-label", t("parametres_langue"));
  Object.entries(LANGUES).forEach(([code, nom]) => choix.add(new Option(nom, code, false, code === etat.langue)));
  choix.addEventListener("change", () => {
    etat.langue = choix.value;
    try { localStorage.setItem("killi_langue", etat.langue); } catch (e) { /* stockage indisponible */ }
    afficher();
  });
}

function preparerCarte() {
  carte = L.map("carte", {worldCopyJump: true}).setView([5, 12], 4);
  fondPlan = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(carte);
  fondSatellite = L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 18,
    attribution: "Powered by Esri · Source : Esri, Maxar, Earthstar Geographics"
  });
  calquePoints = L.layerGroup().addTo(carte);
}

async function demarrer() {
  preparerLangues();
  preparerCarte();
  const message = document.getElementById("message");
  try {
    message.hidden = false;
    message.textContent = t("web_chargement");
    const reponse = await fetch(URL_BASE, {cache: "no-cache"});
    if (!reponse.ok) throw new Error(reponse.status);
    base = await reponse.json();
    preparer();
    afficher();
  } catch (e) {
    afficher();
    message.hidden = false;
    message.textContent = t("web_erreur_chargement");
  }
}

demarrer();
</script>
</body>
</html>
